name: Close merged issues

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues named by pushed commits
        uses: actions/github-script@v7
        with:
          script: |
            // A commit subject ending in "(#N)" names issue N. Only open issues are closed.
            // Issues are never reopened. Each closed issue gets a comment naming the short sha.
            const CLOSING_REF = /\(#(\d+)\)\s*$/;
            const { owner, repo } = context.repo;
            const { before, after } = context.payload;
            // The push payload lists at most 20 commits, so read the full range from the
            // compare API. A new-branch push (before is all zeros) falls back to the payload.
            let commits = [];
            if (/^0+$/.test(before)) {
              commits = (context.payload.commits ?? []).map((c) => ({ sha: c.id, message: c.message }));
            } else {
              for (let page = 1; ; page++) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${before}...${after}`, per_page: 100, page,
                });
                commits.push(...data.commits.map((c) => ({ sha: c.sha, message: c.commit.message })));
                if (data.commits.length < 100) break;
              }
            }
            core.info(`Pushed range ${before}..${after}: ${commits.length} commit(s).`);

            // Commits come oldest first. Walk newest first so the first commit naming an
            // issue is the one cited in its comment.
            const shaByIssue = new Map();
            for (const commit of [...commits].reverse()) {
              const subject = (commit.message ?? "").split("\n")[0];
              const match = CLOSING_REF.exec(subject);
              if (match && !shaByIssue.has(Number(match[1]))) {
                shaByIssue.set(Number(match[1]), commit.sha.slice(0, 7));
              }
            }

            const failures = [];
            for (const [number, shortSha] of shaByIssue) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
                if (issue.pull_request) {
                  core.info(`#${number} is a pull request, skipped.`);
                  continue;
                }
                if (issue.state !== "open") {
                  core.info(`#${number} is already closed, skipped.`);
                  continue;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `Closed by ${shortSha} on main.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: number,
                  state: "closed", state_reason: "completed",
                });
                core.info(`#${number} closed by ${shortSha}.`);
              } catch (error) {
                core.error(`#${number}: ${error.message}`);
                failures.push(number);
              }
            }
            if (failures.length > 0) {
              core.setFailed(`Could not close issue(s): ${failures.join(", ")}`);
            }
